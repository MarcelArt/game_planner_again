<body style="background:#101b2d;margin:20px;display:flex;gap:12px;flex-wrap:wrap"><script src="shared.js"></script><script src="icons.js"></script><script>
GP.items().forEach((it,i)=>{const d=document.createElement('div');const tint=['#5b4a7a','#3f5d86','#3f6f62'][i%3];d.style.cssText=`width:96px;height:96px;border-radius:10px;background:${tint};display:grid;place-items:center;color:#fff;font:600 20px sans-serif`;const u=GP.icon(it.id);d.innerHTML=u?`<img src="${u}" style="width:72px;height:72px;image-rendering:pixelated">`:GP.initials(it.name);document.body.append(d)});
</script></body>

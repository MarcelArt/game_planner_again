[package]
name = "game_planner_again"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
gpui-kit = { version = "0.9.1", features = ["gpui-fast"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
uuid = { version = "1.29.2", features = ["v4"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
gpui-kit = { version = "0.9.1", features = ["gpui-fast", "test-support"] }
tempfile = "3.27.0"
